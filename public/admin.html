<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reviews Dashboard | Davis Delivery</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f8f9fb;color:#1f2937;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px}
.header{background:linear-gradient(135deg,#0a2744,#1e5b92);color:#fff;padding:24px;border-radius:12px;margin-bottom:20px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid #dde2e8;border-radius:10px;padding:14px}
.stat-val{font-size:28px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#0a2744}
.stat-lbl{font-size:10px;font-weight:700;color:#97a3b3;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.login{background:#fff;border:1px solid #dde2e8;border-radius:12px;padding:32px;max-width:400px;margin:60px auto;text-align:center}
.login input{width:100%;padding:12px;font-size:15px;border:1px solid #dde2e8;border-radius:8px;margin:16px 0;font-family:inherit}
.login button{width:100%;padding:12px;background:#e8a838;color:#0a2744;border:none;border-radius:8px;font-weight:800;cursor:pointer;font-size:14px}
.review{background:#fff;border:1px solid #dde2e8;border-radius:10px;padding:16px;margin-bottom:12px}
.review.google{border-left:4px solid #1a9e5c}
.review.google.unclicked{border-left:4px solid #97a3b3}
.review.internal{border-left:4px solid #d63b3b}
.review-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.stars{color:#e8a838;font-size:18px;letter-spacing:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.tag-google{background:#1a9e5c15;color:#1a9e5c}
.tag-internal{background:#d63b3b15;color:#d63b3b}
.comment{color:#5a6779;font-size:14px;line-height:1.5;margin:10px 0;padding:10px;background:#f8f9fb;border-radius:6px}
.meta{font-size:12px;color:#97a3b3}
.meta strong{color:#5a6779;font-weight:600}
.empty{text-align:center;padding:80px 20px;color:#97a3b3}
/* WRITE TO THEM, FROM HERE. Sized for a thumb — Chad reads this dashboard on a phone, and a
   12px text link beside a 10px tag is not a target. Green for the ask, slate for the no-ask
   thank-you, so the two are never confused at a glance. */
.write{display:inline-block;margin-top:10px;padding:12px 16px;border-radius:7px;font-size:13px;font-weight:700;text-decoration:none;line-height:1.2}
.write-ask{background:#15803d;color:#fff}
.write-plain{background:#eef1f5;color:#42505f}
.write-why{font-size:11px;color:#97a3b3;margin-top:5px;line-height:1.45}
/* WHICH BROWSER, AND DID IT LAND. The two facts that together answer "why does only half of
   this reach Google". Marking is a 44px target because it gets done on a phone with the
   Business Profile open in the other tab. */
.client{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:#eef1f5;color:#5a6779;letter-spacing:.3px}
.client-inapp{background:#fdf0e2;color:#a8632a}
.landed-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.landed-q{font-size:12px;color:#5a6779;font-weight:600}
.mark{min-height:44px;min-width:52px;padding:10px 14px;border-radius:7px;border:1px solid #dde2e8;background:#fff;color:#5a6779;font-size:13px;font-weight:700;cursor:pointer}
.mark[aria-pressed="true"]{border-color:transparent;color:#fff}
.mark-yes[aria-pressed="true"]{background:#15803d}
.mark-no[aria-pressed="true"]{background:#d63b3b}
.probe{background:#fff;border:1px solid #dde2e8;border-left:4px solid #e8a838;border-radius:10px;padding:16px;margin-bottom:12px}
.probe h3{font-family:"Plus Jakarta Sans",sans-serif;font-size:15px;color:#0a2744;margin-bottom:6px}
.probe p{font-size:13px;color:#5a6779;line-height:1.55}
.probe table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.probe td{padding:5px 0;color:#5a6779}
.probe td:last-child{text-align:right;font-weight:700;color:#0a2744}
</style>
</head>
<body>
<div class="wrap">
  <div id="content">
    <div class="login" id="login">
      <h2 style="font-family:'Plus Jakarta Sans',sans-serif;color:#0a2744">Reviews Dashboard</h2>
      <p style="color:#97a3b3;font-size:13px;margin-top:6px">Enter dashboard key to access reviews</p>
      <input type="password" id="key" placeholder="Dashboard key" autofocus>
      <button onclick="login()">Sign In</button>
      <p id="err" style="color:#d63b3b;font-size:12px;margin-top:10px"></p>
    </div>
  </div>
</div>
<script>
async function login(){
  const key=document.getElementById("key").value;
  if(!key){document.getElementById("err").textContent="Please enter key";return}
  try{
    const res=await fetch("/.netlify/functions/review?key="+encodeURIComponent(key));
    if(!res.ok){document.getElementById("err").textContent="Invalid key";return}
    const data=await res.json();
    localStorage.setItem("dk",key);
    renderDashboard(data.reviews||[],data.clicksReadable,data.postRate);
  }catch(e){document.getElementById("err").textContent="Connection error"}
}
function logout(){localStorage.removeItem("dk");location.reload()}
function star(n){return"★".repeat(n)+"☆".repeat(5-n)}
// EVERY customer-supplied field goes through this before it reaches innerHTML.
//
// It was missing, and the review POST is public and unauthenticated: anyone could submit a
// review with name="<img src=x onerror=...>" and run script in this page — which holds the
// dashboard key in localStorage. name, contact and proNumber were clamped for LENGTH
// server-side and never escaped, which stops a big payload, not a small one.
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmtDate(iso){return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit",timeZone:"America/New_York"})}
// How a source reads to a human. Mirrors SOURCE_LABEL in netlify/functions/lib/reviews.js.
const SRC_LABEL={"review-email":"Rate button (delivery email)","track-email":"Track link (delivery email)","review-followup":"Follow-up email",direct:"Direct visit",other:"Unrecognised link"};

// THE BUTTON CHAD ASKED FOR, ON THE SCREEN THAT ACTUALLY KNOWS THE ANSWER.
//
// "Where is my button to generate my email to customer saying their review didn't make it to
// Google" — asked of a five-star ALERT, which is sent the instant the customer hits Send and
// therefore cannot know yet. This row can: googleClickAt is stamped by g.js on a real click
// and by nothing else. So the wording is graded by what the row actually shows, and a review
// that DID reach Google gets a thank-you with no apology and no second ask, rather than the
// same note with its facts wrong.
//
// The href is built server-side by lib/owner-thanks — the same function the alert email uses —
// so the note is identical whichever surface he taps, and the two cannot drift. Nothing is
// sent from here: it opens his own compose window and he decides.
//
// No href means no address on file (anonymous review AND no email on the order, or a record
// that predates customerEmail). The row says so rather than showing a dead button, because a
// button that opens an empty compose window is the thing being fixed.
function writeBlock(r){
  if(!r||!r.thanksHref){
    if(r&&r.routedTo==="google"&&!r.googleClickAt) return '<div class="write-why">No email on file for this one — nothing to write to.</div>';
    return "";
  }
  const took=r.thanksClicked===true;
  const label=took?"\u2709\ufe0f Say thank you"
    :(r.thanksRecipient==="account"?"\u2709\ufe0f Write to the customer &amp; ask for the Google review"
      :"\u2709\ufe0f Ask them for the Google review");
  const acct=r.thanksRecipient==="account"?", the contact on the order (the review was anonymous)":"";
  // The wording follows the strongest fact available: a mark from the Business Profile if
  // there is one, otherwise the click. "Shown and not taken" is only true when nobody has
  // checked — once a row is marked "did not post" we know they DID take it and it still
  // did not land, which is a different sentence.
  const marked=r.postedOnGoogle===true||r.postedOnGoogle===false;
  const why=took
    ? `${marked?"You marked this one as posted":"They took the Google link"}, so this note carries no second ask. Goes to <strong>${esc(r.thanksTo)}</strong>${acct}.`
    : (r.thanksClicked===false
      ? `${r.postedOnGoogle===false?"You marked this one as never posting \u2014 the note says so and links straight to Google":"The link was shown and not taken \u2014 the note says exactly that and links straight to Google"}. Goes to <strong>${esc(r.thanksTo)}</strong>${acct}.`
      : `We can't tell whether this one reached Google, so the note is worded \u201clooks like\u201d. Goes to <strong>${esc(r.thanksTo)}</strong>${acct}.`);
  return `<a class="write ${took?"write-plain":"write-ask"}" href="${esc(r.thanksHref).replace(/&/g,"&amp;")}">${label}</a>
      <div class="write-why">${why}</div>`;
}
// Friendly names for the browser buckets. The raw verdict strings are stable identifiers;
// these are for reading. An unrecorded client is NOT "unknown browser" — it is a click from
// before we started looking, and it says so.
const CLIENT_LABEL={
  "ios-inapp":"in-app (iPhone email)","android-inapp":"in-app (Android)",
  "outlook-inapp":"in-app (Outlook)","google-app-inapp":"in-app (Google app)",
  "facebook-inapp":"in-app (Facebook)","instagram-inapp":"in-app (Instagram)",
  "safari-ios":"Safari (iPhone)","chrome-ios":"Chrome (iPhone)","firefox-ios":"Firefox (iPhone)",
  "edge-ios":"Edge (iPhone)","chrome-android":"Chrome (Android)","android-other":"Android browser",
  "chrome-desktop":"Chrome (desktop)","safari-desktop":"Safari (desktop)",
  "firefox-desktop":"Firefox (desktop)","edge-desktop":"Edge (desktop)",
  "other":"other browser","unknown":"no browser sent",
};
function clientChip(r){
  if(!r.googleClickAt)return"";
  if(!r.googleClient)return`<span class="client" title="This click predates browser capture">browser not recorded</span>`;
  const inapp=/-inapp$/.test(r.googleClient);
  return `<span class="client ${inapp?"client-inapp":""}" title="${esc(r.googleClientUA||"")}">${esc(CLIENT_LABEL[r.googleClient]||r.googleClient)}</span>`;
}

// THE ONE FACT THIS SYSTEM CANNOT SEE FOR ITSELF. Google never tells us whether a review was
// published, so the click is the furthest the machine can get on its own. Chad can read it
// off his Business Profile in seconds; this is where that knowledge gets stored so the
// machine can use it — for the split below, and so the apology note stops guessing.
//
// Only offered on rows that actually reached Google. Asking "did it post?" about someone who
// never took the link is a question with no meaning.
function landedRow(r){
  if(!r.googleClickAt)return"";
  const y=r.postedOnGoogle===true,n=r.postedOnGoogle===false;
  return `<div class="landed-row">
      <span class="landed-q">Did it post on Google?</span>
      <button class="mark mark-yes" aria-pressed="${y}" onclick="markLanded('${esc(r.id)}',${y?"null":"true"})">Yes</button>
      <button class="mark mark-no" aria-pressed="${n}" onclick="markLanded('${esc(r.id)}',${n?"null":"false"})">No</button>
      ${y||n?'<span class="write-why" style="margin:0">Tap again to clear.</span>':'<span class="write-why" style="margin:0">Unanswered \u2014 not counted either way.</span>'}
    </div>`;
}

async function markLanded(id,landed){
  const key=localStorage.getItem("dk")||"";
  try{
    const res=await fetch("/.netlify/functions/review?key="+encodeURIComponent(key),{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({id:id,landed:landed}),
    });
    if(!res.ok)throw new Error("save failed");
    // Re-read rather than patching the DOM: the summary above has to move too, and a screen
    // that shows a mark the server may not have taken is the failure this repo keeps having.
    login();
  }catch(e){ alert("Couldn't save that — check your connection and try again."); }
}

// WHY DOESN'T ALL OF THIS REACH GOOGLE? The panel that answers it, or says plainly that it
// cannot yet. It never prints a conclusion below the row threshold: Davis gets one or two
// five-star reviews a day, and a story fitted to three of them is exactly the mistake this
// whole exercise exists to avoid.
function probePanel(pr){
  if(!pr)return"";
  const pct=(b)=>b.checked?Math.round((b.landed/b.checked)*100)+"%":"—";
  const line=(name,b)=>`<tr><td>${name}</td><td>${b.checked?`${b.landed} of ${b.checked} posted &middot; ${pct(b)}`:`${b.arrived} arrived, none checked yet`}</td></tr>`;
  const need=Math.max(0,pr.minPerArm-pr.inApp.checked)+Math.max(0,pr.minPerArm-pr.browser.checked);
  return `<div class="probe">
      <h3>Why doesn't all of this reach Google?</h3>
      <p>They all arrive &mdash; the click log proves that. What we're testing is whether the ones that never post are the ones who tapped inside an <strong>email app's built-in browser</strong>, where they're signed out of Google even when they're signed in everywhere else. Mark each review below Yes or No against your Business Profile and this fills in.</p>
      <table>
        ${line("In-app browsers",pr.inApp)}
        ${line("Real browsers (Safari, Chrome&hellip;)",pr.browser)}
        ${pr.notRecorded.arrived?line("Before we recorded the browser",pr.notRecorded):""}
        <tr><td>Arrived at Google</td><td>${pr.arrived}</td></tr>
        <tr><td>Checked so far</td><td>${pr.checked} of ${pr.arrived}</td></tr>
      </table>
      <p style="margin-top:10px">${pr.sufficient
        ? `<strong>${esc(pr.leans)}.</strong> That is a comparison, not a cause &mdash; Google also filters solicited reviews, and that could concentrate in one group too.`
        : `<strong>Not enough marked yet to say.</strong> Needs ${pr.minPerArm} checked in each group; ${need} more to go. Until then these are counts, not an answer.`}</p>
    </div>`;
}

function renderDashboard(reviews,clicksReadable,postRate){
  const googleCount=reviews.filter(r=>r.routedTo==="google").length;
  const internalCount=reviews.filter(r=>r.routedTo==="internal").length;
  // The honest number. googleCount is how many were SHOWN the link; this is how many
  // actually took it. The two were conflated for as long as this dashboard existed — the
  // badge said "Sent to Google" on the strength of the rating alone.
  const clickedCount=reviews.filter(r=>r.googleClickAt).length;
  // Only reviews that could POSSIBLY have a click count in the rate. Records written before
  // click tracking existed have no clickRef and would drag it toward zero forever.
  const trackable=reviews.filter(r=>r.clickRef&&r.routedTo==="google");
  const rate=trackable.length?Math.round((trackable.filter(r=>r.googleClickAt).length/trackable.length)*100)+"%":"—";
  const avg=reviews.length?(reviews.reduce((s,r)=>s+r.rating,0)/reviews.length).toFixed(1):"—";
  let html=`
    <div class="header">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h1 style="font-family:'Plus Jakarta Sans',sans-serif;font-size:24px">Reviews Dashboard</h1>
          <p style="color:rgba(255,255,255,.6);font-size:13px;margin-top:2px">Davis Delivery Tracking Portal</p>
        </div>
        <button onclick="logout()" style="padding:8px 16px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600">Sign out</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-val">${reviews.length}</div><div class="stat-lbl">Total Reviews</div></div>
      <div class="stat"><div class="stat-val">${avg}</div><div class="stat-lbl">Avg Rating</div></div>
      <div class="stat"><div class="stat-val" style="color:#5a6779">${googleCount}</div><div class="stat-lbl">Shown the link</div></div>
      <div class="stat"><div class="stat-val" style="color:#1a9e5c">${clickedCount}</div><div class="stat-lbl">Clicked through</div></div>
      <div class="stat"><div class="stat-val" style="color:#1a9e5c">${rate}</div><div class="stat-lbl">Click-through rate</div></div>
      <div class="stat"><div class="stat-val" style="color:#d63b3b">${internalCount}</div><div class="stat-lbl">Internal Only</div></div>
    </div>
    <div style="background:#fff;border:1px solid #dde2e8;border-left:4px solid #e8a838;border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:12px;color:#5a6779;line-height:1.5">
      <strong style="color:#0a2744">"Clicked through" is the furthest this system can see.</strong>
      It means the customer took the Google link. Whether they then signed in and posted
      happens on Google, and Google tells us nothing — so a click is evidence they went, not
      proof a review exists. Counts only reviews submitted since click tracking was added;
      older ones have no click record either way.${clicksReadable===false?' <strong style="color:#d63b3b">The click store could not be read on this load, so every row below shows no click.</strong>':''}
    </div>
    ${probePanel(postRate)}
  `;
  if(!reviews.length){
    html+='<div class="empty"><div style="font-size:48px;margin-bottom:12px">⭐</div><div style="font-size:15px;color:#5a6779;font-weight:600">No reviews yet</div><div style="font-size:12px;margin-top:4px">Reviews submitted by customers will appear here</div></div>';
  } else {
    html+=reviews.map(r=>`
      <div class="review ${r.routedTo==="google"?"google":"internal"}${r.routedTo==="google"&&!r.googleClickAt?" unclicked":""}">
        <div class="review-head">
          <div>
            <div class="stars">${star(Math.max(0,Math.min(5,Number(r.rating)||0)))}</div>
            <div style="font-size:13px;color:#5a6779;margin-top:3px"><strong>${esc(r.name)||"Anonymous"}</strong>${r.contact?" · "+esc(r.contact):""}</div>
          </div>
          <span class="tag ${r.googleClickAt?"tag-google":"tag-internal"}">${r.routedTo==="google"?(r.googleClickAt?"Went to Google":(r.clickRef?"Link shown — not taken":"Link shown — not tracked")):"Internal Only"}</span>
        </div>
        ${r.comment?`<div class="comment">${esc(r.comment)}</div>`:""}
        <div class="meta">PRO# <strong>${esc(r.proNumber)||"—"}</strong> · ${esc(fmtDate(r.submittedAt))}${r.driver?` · Driver <strong>${esc(r.driver)}</strong>`:""}</div>
        <div class="meta" style="margin-top:3px">Came from <strong>${esc(SRC_LABEL[r.source]||(r.source?r.source:"Not recorded"))}</strong>${r.googleClickAt?` · Took the Google link ${esc(fmtDate(r.googleClickAt))}${r.googleClickCount>1?` (${Number(r.googleClickCount)||0}×)`:""}`:""}${r.googleClickProbes?` · ${Number(r.googleClickProbes)||0} bot fetch${r.googleClickProbes>1?"es":""} (not counted)`:""}${r.googleClickAt?` · ${clientChip(r)}`:""}</div>
        ${landedRow(r)}
        ${writeBlock(r)}
      </div>
    `).join("");
  }
  document.getElementById("content").innerHTML=html;
}
// Auto-login if key saved
const savedKey=localStorage.getItem("dk");
if(savedKey){
  document.getElementById("key").value=savedKey;
  login();
}
document.getElementById("key")?.addEventListener("keydown",e=>{if(e.key==="Enter")login()});
</script>
</body>
</html>
